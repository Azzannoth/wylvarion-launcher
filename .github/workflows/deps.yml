name: Fetch build dependencies
# Stáhne veřejné knihovny (Paper API apod.) do větve "deps" – pro sestavení pluginů mimo GitHub.
on:
  push:
    branches: [deps-request]
permissions:
  contents: write
jobs:
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: mvn -B -q dependency:copy-dependencies -DoutputDirectory=/tmp/out
      - run: |
          cd /tmp/out && ls
          git init -q -b deps && git config user.name wylvarion-bot && git config user.email bot@wylvarion.cz
          git add -A && git commit -qm deps
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" deps
