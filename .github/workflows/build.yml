name: Build launcher

# Spustí se po vytvoření vydání (Releases → Draft a new release, tag v1.0.1 apod.)
# nebo ručně v záložce Actions (jen sestaví, nic nevydá).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build & publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.target }} --publish ${{ github.event_name == 'release' && 'always' || 'never' }}
      # Balíček pro Microsoft Store (MSIX). Sestaví se jen na Windows a jen když jsou v repozitáři
      # nastavené proměnné STORE_IDENTITY_NAME, STORE_PUBLISHER a STORE_PUBLISHER_NAME
      # (Settings → Secrets and variables → Actions → Variables; hodnoty jsou v Partner Center → Product identity).
      - name: Build Microsoft Store package
        if: ${{ matrix.os == 'windows-latest' && vars.STORE_IDENTITY_NAME != '' }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win appx --x64 --publish never -c.appx.identityName="${{ vars.STORE_IDENTITY_NAME }}" -c.appx.publisher="${{ vars.STORE_PUBLISHER }}" -c.appx.publisherDisplayName="${{ vars.STORE_PUBLISHER_NAME }}"
      - uses: actions/upload-artifact@v4
        if: ${{ matrix.os == 'windows-latest' && vars.STORE_IDENTITY_NAME != '' }}
        with:
          name: microsoft-store-package
          path: dist/*.appx
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name != 'release' }}
        with:
          name: launcher-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.dmg
          if-no-files-found: ignore
