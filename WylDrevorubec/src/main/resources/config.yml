    min-leaves: 4
    max-logs: 60
    max-radius: 7
    sapling: ACACIA_SAPLING
  dark_oak:
    logs: [DARK_OAK_LOG, DARK_OAK_WOOD]
    leaves: [DARK_OAK_LEAVES]
    natural-leaves: true
    min-leaves: 4
    max-logs: 120
    max-radius: 7
    sapling: DARK_OAK_SAPLING
  pale_oak:
    logs: [PALE_OAK_LOG, PALE_OAK_WOOD]
    leaves: [PALE_OAK_LEAVES]
    natural-leaves: true
    min-leaves: 4
    max-logs: 120
    max-radius: 7
    sapling: PALE_OAK_SAPLING
  cherry:
    logs: [CHERRY_LOG, CHERRY_WOOD]
    leaves: [CHERRY_LEAVES]
    natural-leaves: true
    min-leaves: 4
    max-logs: 80
    max-radius: 8
    sapling: CHERRY_SAPLING
  mangrove:
    logs: [MANGROVE_LOG, MANGROVE_WOOD]
    leaves: [MANGROVE_LEAVES]
    natural-leaves: true
    min-leaves: 4
    max-logs: 150
    max-radius: 8
  azalea:
    logs: [OAK_LOG, OAK_WOOD]
    leaves: [AZALEA_LEAVES, FLOWERING_AZALEA_LEAVES]
    natural-leaves: true
    min-leaves: 4
    max-logs: 40
    max-radius: 4
  crimson:
    logs: [CRIMSON_STEM, CRIMSON_HYPHAE]
    leaves: [NETHER_WART_BLOCK, SHROOMLIGHT]
    natural-leaves: false
    min-leaves: 4
    max-logs: 120
    max-radius: 6
  warped:
    logs: [WARPED_STEM, WARPED_HYPHAE]
    leaves: [WARPED_WART_BLOCK, SHROOMLIGHT]
    natural-leaves: false
    min-leaves: 4
    max-logs: 120
    max-radius: 6

